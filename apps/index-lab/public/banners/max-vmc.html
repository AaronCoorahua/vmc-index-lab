<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Max, el asistente AI de VMC</title>
<!-- Campaña «Max, el asistente AI de VMC» (22/10): réplica en HTML del sistema de banners de Max (capturas de Abraham, 127.0.0.1:8778).
     Texto y CTA en HTML; el arte (Max y su escenario) es una imagen a la derecha o abajo, fundida con el fondo.
     Max ahora es un solo personaje real (max/<tema>-<formato>.jpg, fotos de Flow recortadas al formato, al doble).
     Uso: max-vmc.html?t=oscuro|claro&f=side264|side400|strip776|strip1532|hero776|mini311 (mini: &op=saluda|escucha) -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;background:transparent}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #fff;outline-offset:-2px}

.bn{position:relative;display:flex;flex-direction:column;height:100%;overflow:hidden;isolation:isolate;border-radius:16px;color:#fff;
  background:radial-gradient(60% 120% at 85% 50%,#6A3BE0 0%,rgb(106 59 224 / 0%) 70%),linear-gradient(110deg,#4B1FB5 0%,#2C0D86 45%,#170848 100%)}
.bn > *{position:relative;z-index:2}
.art{position:absolute !important;z-index:0 !important;display:block;pointer-events:none}
.tx{display:grid;gap:8px;justify-items:start}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 9px;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap;
  background:#6B42DE;box-shadow:inset 0 0 0 1px rgb(255 255 255 / 35%)}
h1{font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.lede{font-weight:500;color:rgb(255 255 255 / 85%);text-wrap:pretty}
.cta{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;border-radius:9999px;font-weight:700;white-space:nowrap;color:#fff;
  background:linear-gradient(180deg,#F7A452 0%,#EC7B2B 100%);box-shadow:inset 0 0 0 2px rgb(255 255 255 / 70%),rgb(236 123 43 / 40%) 0 8px 20px -6px;transition:transform .15s}
.bn:hover .cta{transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.cta{transition:none}}

/* Verticales: texto arriba, Max abajo; el CTA (ancho completo) va encima del arte. */
[data-f^=side] .art{left:0;bottom:0;width:100%;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 28%);mask-image:linear-gradient(180deg,transparent 0%,#000 28%)}
[data-f^=side] .cta{align-self:stretch;margin-top:auto}
[data-f=side264] .bn{padding:16px;gap:8px}
[data-f=side264] h1{font-size:21px;line-height:24px}
[data-f=side264] .lede{font-size:11px;line-height:14px}
[data-f=side264] .cta{height:38px;font-size:13px}
[data-f=side400] .bn{padding:18px 16px 16px;gap:10px}
[data-f=side400] h1{font-size:23px;line-height:26px}
[data-f=side400] .lede{font-size:12px;line-height:16px}
[data-f=side400] .cta{height:40px;font-size:14px}
/* Franjas y hero: texto a la izquierda, Max a la derecha a todo el alto. */
[data-f^=strip] .art,[data-f=hero776] .art{top:0;right:0;height:100%;width:auto;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 22%);mask-image:linear-gradient(90deg,transparent 0%,#000 22%)}
[data-f=strip776] .bn{padding:28px 32px;justify-content:center;gap:14px}
[data-f=strip776] h1{font-size:32px;line-height:34px;max-width:420px}
[data-f=strip776] .lede{font-size:13px}
[data-f=strip776] .cta{height:44px;padding:0 56px;font-size:15px}
[data-f=strip1532] .bn{padding:0 72px;justify-content:center;gap:10px}
[data-f=strip1532] h1{font-size:34px;line-height:38px}
[data-f=strip1532] .lede{font-size:14px}
[data-f=strip1532] .cta{height:44px;padding:0 56px;font-size:15px}
[data-f=hero776] .bn{padding:0 48px;justify-content:center;gap:20px}
[data-f=hero776] .tx{gap:12px}
[data-f=hero776] h1{font-size:38px;line-height:41px;max-width:380px}
[data-f=hero776] .lede{font-size:14px;line-height:20px;max-width:360px}
/* En el hero el CTA va con contorno (como la referencia). */

/* ── Claro: superficie blanca con lila a la derecha, texto morado y CTA morado. ── */
[data-t=claro] .bn{color:#2A0C80;background:radial-gradient(60% 120% at 92% 40%,#E9DEFF 0%,rgb(233 222 255 / 0%) 70%),#fff;box-shadow:inset 0 0 0 1px #ECE7F7}
[data-t=claro] .pill{color:#fff;background:#5A35C2;box-shadow:none}
[data-t=claro] .lede{color:#4A4560}

/* Píldora de vidrio (22/10): translúcida con desenfoque, borde claro y brillo arriba; en fondo claro, vidrio blanco con texto morado. */
.bn .pill{color:#fff;border:1px solid rgb(255 255 255 / 38%);background:linear-gradient(180deg,rgb(255 255 255 / 26%),rgb(255 255 255 / 10%));-webkit-backdrop-filter:blur(10px) saturate(160%);backdrop-filter:blur(10px) saturate(160%);box-shadow:inset 0 1px 0 rgb(255 255 255 / 45%),0 4px 12px -4px rgb(10 0 40 / 35%)}
.bn .pill::before{display:none}
[data-tono=claro] .bn .pill,[data-t=claro] .bn .pill{color:#3B1782;border-color:rgb(90 53 194 / 28%);background:linear-gradient(180deg,rgb(255 255 255 / 80%),rgb(255 255 255 / 45%));box-shadow:inset 0 1px 0 #fff,0 4px 12px -6px rgb(58 26 156 / 35%)}
/* Claro ancho (22/10): la foto en alta, un halo violeta-durazno en la unión y dos globos de vidrio flotando sobre ella. */
.halo{position:absolute !important;z-index:0 !important;right:52%;top:50%;width:420px;height:420px;transform:translate(50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgb(255 176 120 / 45%),rgb(176 140 255 / 30%) 55%,transparent);filter:blur(8px)}
.gb{position:absolute !important;z-index:3 !important;border-radius:16px 16px 16px 5px;pointer-events:none;border:1px solid rgb(255 255 255 / 85%);
  background:linear-gradient(160deg,rgb(255 255 255 / 70%),rgb(233 222 255 / 35%));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:inset 0 1px 0 #fff,0 10px 24px -10px rgb(58 26 156 / 45%)}
.gb::after{content:"";position:absolute;left:12px;right:30%;top:40%;height:6px;border-radius:3px;background:rgb(90 53 194 / 35%);box-shadow:0 12px 0 rgb(90 53 194 / 22%)}
[data-f=hero776] .gb1{right:20px;top:26px;width:70px;height:44px;border-radius:14px 14px 4px 14px}
[data-f=hero776] .gb2{right:46px;top:80px;width:48px;height:32px;border-radius:12px 12px 4px 12px}
[data-f=strip1532] .gb1{right:24px;top:22px;width:62px;height:40px;border-radius:12px 12px 4px 12px}
[data-f=strip1532] .gb2{right:44px;top:72px;width:42px;height:28px;border-radius:10px 10px 4px 10px}
[data-f=strip1532] .halo{right:22%;width:360px;height:360px}

/* CTA del DS (22/10): receta del botón primary de Concorde (degradado naranja → violeta, borde degradado blanco → #FBC47D →
   #AE8EFF → blanco, brillo interior) sin ícono (22/10: Abraham descartó la ranura con ícono). */
.bn .cta{position:relative;overflow:hidden;padding:0 28px;border:2px solid transparent;color:#fff;text-shadow:rgb(0 0 0 / 25%) 0 1px 3px;
  background-image:linear-gradient(135deg,#ED8936 0%,#ED8936 40%,#8460E5 100%),linear-gradient(135deg,#fff 0%,#FBC47D 25%,#AE8EFF 75%,#fff 100%);
  background-origin:padding-box,border-box;background-clip:padding-box,border-box;
  box-shadow:rgb(255 255 255 / 28%) 0 1px 0 2px inset,rgb(237 137 54 / 30%) 0 2px 6px,rgb(10 0 40 / 30%) 0 8px 18px -8px}
.bn .cta::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(rgb(255 255 255 / 17%) 0%,transparent 55%);pointer-events:none}
.bn:hover .cta{transform:translateY(-1px) scale(1.02);box-shadow:rgb(255 255 255 / 22%) 0 1px 0 2px inset,rgb(132 96 229 / 35%) 0 8px 24px,rgb(237 137 54 / 40%) 0 4px 10px}
[data-f=hero776] .bn .cta{height:48px;font-size:16px;padding:0 32px}
@media (prefers-reduced-motion:reduce){.bn:hover .cta{transform:none}}
/* Mini 311 × 60 (22/10): miniatura cuadrada de Max a la izquierda y dos líneas; toda la pieza es el enlace al chat, sin CTA. */
[data-f=mini311] .bn{flex-direction:row;align-items:center;gap:12px;padding:6px 14px 6px 6px;border-radius:12px}
[data-f=mini311] .thumb{flex:none;width:48px;height:48px;border-radius:10px;object-fit:cover;box-shadow:inset 0 0 0 1px rgb(255 255 255 / 25%),0 4px 10px -4px rgb(10 0 40 / 50%)}
/* Oscuro: el degradado parte del violeta del fondo de la foto (#2B1663, muestreado en sus bordes), con el mismo halo lila detrás de
   Max, y la miniatura sin marco: se funde con el banner en vez de verse como un recuadro pegado. */
[data-f=mini311][data-t=oscuro] .bn{background:radial-gradient(70px 70px at 30px 50%,rgb(132 96 229 / 45%),rgb(132 96 229 / 0%)),linear-gradient(90deg,#2B1663 0%,#34157F 50%,#22095E 100%)}
[data-f=mini311][data-t=oscuro] .thumb{box-shadow:none}
/* Claro: fotos propias con fondo blanco-lila; el banner parte del lila de su fondo (#F0E3FD, muestreado) y aclara hacia la derecha. */
[data-f=mini311][data-t=claro] .bn{background:radial-gradient(70px 70px at 30px 50%,rgb(233 222 255 / 90%),rgb(233 222 255 / 0%)),linear-gradient(90deg,#F0E3FD 0%,#F6F0FE 55%,#FFFFFF 100%)}
[data-f=mini311][data-t=claro] .thumb{box-shadow:none}
[data-f=mini311] .tx{gap:1px;min-width:0;flex:1}
[data-f=mini311] h1{font-size:15px;line-height:19px;letter-spacing:-.01em;white-space:nowrap}
[data-f=mini311] .lede{font-size:12px;line-height:16px}
[data-f=mini311] .go{flex:none;width:20px;height:20px;opacity:.85;transition:transform .15s}
[data-f=mini311] .bn:hover .go{transform:translateX(2px)}
@media (prefers-reduced-motion:reduce){[data-f=mini311] .go{transition:none}}
</style></head>
<body>
<a class="bn" target="_blank" rel="noopener"></a>
<script src="blend.js"></script>
<script>
// Copy de la referencia, uno por formato (cada formato tiene su propio mensaje).
const COPY = {
  side264:   { h: "¿Cómo participo?", p: "Pregúntale a Max sobre VMC.", cta: "¡Empecemos!" },
  side400:   { h: "Max te orienta.", p: "Encuentra cómo participar en VMC.", cta: "¡Guíame, Max!" },
  strip776:  { h: "¿Cómo funciona VMC? Pregúntale a Max.", p: "Te guía con registro, ofertas y participación.", cta: "¡Pregunta a Max!" },
  strip1532: { h: "¿Tienes dudas para participar? Max te orienta.", p: "Encuentra rápido la información del Centro de Ayuda que necesitas.", cta: "¡Hablar con Max!" },
  mini311:   { h: "¿Tienes alguna duda?", p: "Consúltale a Max.", cta: "Abrir chat" },
  hero776:   { h: "Tu guía para participar en VMC.", p: "Encuentra en conversación la ayuda que necesitas para registrarte, participar y entender cómo funciona VMC.", cta: "¡Preguntar a Max!" },
};
// Arte por tema y formato (22/10): un solo personaje (max/personaje-referencia.jpg) en 7 tomas de Flow, recortadas a cada formato.
// Claro: 776 = celebra con el celular; 264, 400, 1532 y hero = la toma del saludo.
const ART = {
  oscuro: { side264: "dark-side264", side400: "dark-side400", strip776: "dark-strip776", strip1532: "dark-strip1532", hero776: "dark-hero776" },
  claro:  { side264: "light-side264", side400: "light-hero776", strip776: "light-strip776", strip1532: "light-strip1532", hero776: "light-hero776" },
};
const q = new URLSearchParams(location.search);
const f = COPY[q.get("f")] ? q.get("f") : "strip776", t = q.get("t") === "claro" ? "claro" : "oscuro";
document.body.dataset.f = f; document.body.dataset.t = t;
const c = COPY[f], side = f.startsWith("side");
const bn = document.querySelector(".bn");
// Claro 400 y hero: la toma horizontal encuadrada en la persona.
const fit = t === "claro" && f === "side400" ? ` style="height:230px;width:100%;object-fit:cover;object-position:70% 0%"`
  : t === "claro" && f === "hero776" ? ` style="width:430px;object-fit:cover;object-position:80% 50%"` : "";
// Claro ancho: halo cálido detrás de la unión y globos de chat de vidrio junto a la mano (eco de los globos de la versión oscura).
const deco = t === "claro" && (f === "hero776" || f === "strip1532") ? `<span class="halo"></span><span class="gb gb1"></span><span class="gb gb2"></span>` : "";
if (f === "mini311") { // dos opciones de miniatura (?op=saluda|escucha)
  const op = q.get("op") === "escucha" ? "escucha" : "saluda";
  bn.innerHTML = `<img class="thumb" src="max/mini-${op}${t === "claro" ? "-claro" : ""}.jpg" alt="">
  <div class="tx"><h1>${c.h}</h1><p class="lede">${c.p}</p></div>
  <svg class="go" viewBox="0 0 20 20" aria-hidden><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 7l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
} else {
bn.innerHTML = `${deco}<img class="art" src="max/${ART[t][f]}.jpg" alt=""${fit}>
  <div class="tx"><span class="pill">Max, el asistente AI de VMC</span><h1>${c.h}</h1>${c.p ? `<p class="lede">${c.p}</p>` : ""}</div>
  <span class="cta">${c.cta}</span>`;
blendBanner(bn, bn.querySelector(".art"), side, t === "claro");
}
// ponytail: el destino del chat de Max no existe en el lab (#max); en producción, la URL del chat.
bn.href = `#max?utm_source=vmc&utm_medium=banner&utm_campaign=max&utm_content=${t}_${f}`;
bn.setAttribute("aria-label", `${c.h} ${c.cta}`);
document.title = c.h;
</script>
</body></html>
